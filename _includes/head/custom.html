{% include base_path %}

<!-- start custom head snippets -->

<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Fonts: Newsreader for the name and headings, Inter for body text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">

<!-- Apply the saved or OS theme before first paint, so dark mode does not flash light -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) { t = "dark"; }
      if (t === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
    } catch (e) {}
  })();
</script>

<!-- MathJax: only on pages that set `mathjax: true` in their front matter -->
{% if page.mathjax %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- end custom head snippets -->
