{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="site-nav" aria-label="Main">
      <a class="site-nav__brand" href="{{ base_path }}/">{{ site.title }}</a>
      <ul class="site-nav__links">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
          <li><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
        <li>
          <button type="button" id="theme-toggle" class="site-nav__theme" aria-label="Toggle dark mode">
            <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
